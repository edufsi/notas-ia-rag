[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notas-ia-legal-rag"
version = "0.1.0"
description = "Recuperação jurídica local do Notas.IA"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dense = [
  "faiss-cpu>=1.9,<2",
  "numpy>=2,<3",
  "sentence-transformers>=3.3,<4",
]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["avaliar", "busca_densa", "busca_lexical", "comparar", "ingestao", "rag_tool", "recuperacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

