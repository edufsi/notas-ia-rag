# Enriquecimento dos trechos: termos extras que entram SÓ no índice de busca.
# A LLM continua recebendo apenas o texto oficial da lei; nada daqui aparece na resposta.
#
# Para que serve: aproximar o trecho do jeito como a usuária escreve ("cadeia" em vez de
# "prisão", "tirar ele de casa" em vez de "afastamento do lar").
#
# REGRA PRINCIPAL: escreva a partir do TEXTO DA LEI e de fontes externas (cartilhas, FAQs,
# relatos públicos), SEM olhar o gabarito. Termos copiados das perguntas do gabarito fazem
# o número subir sem medir nada (é como estudar com a prova na mão).
#
# Campos (todos opcionais):
#   palavras_chave  termos soltos, sinônimos e gírias: [cadeia, soltura, preso]
#   expressoes      frases curtas como a usuária diria: ["ser avisada quando ele sair da prisão"]
#   categorias      tipos de violência a que o trecho se aplica, com os mesmos rótulos do
#                   classificador: fisica, psicologica, sexual, patrimonial, moral, vicaria.
#                   Deixe vazio para trechos gerais (ex.: medidas protetivas valem para todos).
#                   Ainda não são usadas na busca: servirão para o reforço por categoria.
#
# Chave: id do trecho, como em corpus/trechos.jsonl (ex.: lei-11340-2006:art21,
# lei-11340-2006:art7-p4). A ingestão recusa ids que não existem e categorias fora da lista.
# Depois de editar: rodar ingestao.py e reindexar (a versão do corpus muda).
#
# Exemplo de formato (comentado de propósito):
#
#   lei-11340-2006:art7-p1:
#     palavras_chave: [...]
#     expressoes: ["..."]
#     categorias: [fisica]

trechos: {}
